# Intel 核显 NAS 一体化部署：播放器、夸克搜索、Plex 保护。
# 仅需修改 APP_PASSWORD 和 group_add 的核显组号，不需要 .env。
name: vipvideo-web

x-browser-image: &browser-image
  image: "${CI_IMAGE:-ghcr.io/loren1997/vipvideo-web:latest}"

services:
  web:
    image: ghcr.io/loren1997/vipvideo-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 填入原部署密码，至少 16 位；留空时服务拒绝启动。
      APP_PASSWORD: ""
      PORT: "3000"
      DATA_DIR: /app/data
      COOKIE_SECURE: "false"
      BACKGROUND_MODE: low
      TRANSCODE_ENABLED: "true"
      TRANSCODE_ACCEL: vaapi
      TRANSCODE_ALLOW_SOFTWARE: "false"
      FFMPEG_PATH: ffmpeg
      LIBVA_DRIVER_NAME: iHD
      QUARK_SEARCH_API: http://pansou:8888/api/search
      QUARK_BROWSER_URL: http://quark-browser:3020
      QUARK_SEARCH_PROXY: ""
      DANMAKU_API_URL: http://danmaku:9321
      DANMAKU_API_TOKEN: vipvideo-local-danmaku
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # Ubuntu 执行 stat -c '%g' /dev/dri/renderD128，把下面占位文字替换为输出的数字。
      - "填写_RENDER_GID"
    volumes:
      - vipvideo_data:/app/data
    depends_on:
      pansou:
        condition: service_healthy
    stop_grace_period: 20s
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    blkio_config:
      weight: 100
    tmpfs:
      - /tmp:size=128m,mode=1777

  quark-browser:
    <<: *browser-image
    command: ["node", "browser-worker.mjs"]
    restart: unless-stopped
    init: true
    environment:
      PORT: "3020"
      HOME: /tmp
      QUARK_SEARCH_PROXY: ""
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
      - /app/data:size=16m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256

  pansou:
    image: ghcr.io/fish2018/pansou@sha256:d371fe5caa87794414dd54cda063fcfc456d5013e18b65dbf1f6ca17f6299492
    restart: unless-stopped
    expose:
      - "8888"
    environment:
      PORT: "8888"
      AUTH_ENABLED: "false"
      CHANNELS: Quark_Movies
      ENABLED_PLUGINS: pansearch,quark4k,quarktv
      CONCURRENCY: "2"
      HTTP_MAX_CONNS: "4"
      PLUGIN_TIMEOUT: "6"
      ASYNC_PLUGIN_ENABLED: "true"
      ASYNC_RESPONSE_TIMEOUT: "4"
      ASYNC_MAX_BACKGROUND_WORKERS: "1"
      ASYNC_MAX_BACKGROUND_TASKS: "8"
      ASYNC_LOG_ENABLED: "false"
      CACHE_ENABLED: "true"
      CACHE_PATH: /app/cache
      CACHE_MAX_SIZE: "32"
      CACHE_TTL: "60"
      GOMAXPROCS: "1"
    cpus: 0.25
    cpu_shares: 128
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
      - /app/cache:size=64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  danmaku:
    image: logvar/danmu-api@sha256:7c6c80e6e51d0a77aaa8745a1cbaf95fe333118697d3fdaaabc5ca3bc24e5529
    restart: unless-stopped
    init: true
    environment:
      TOKEN: vipvideo-local-danmaku
      SOURCE_ORDER: tencent,iqiyi,youku,imgo,bilibili
      RATE_LIMIT_MAX_REQUESTS: "0"
      YOUKU_CONCURRENCY: "2"
      DANMU_LIMIT: "5"
      SEARCH_CACHE_MINUTES: "5"
      OTHER_SERVER: http://127.0.0.1:9321/disabled
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.cache:size=96m,mode=1777
      - /app/config:size=2m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9321/'+process.env.TOKEN+'/api/v2/search/anime?keyword=',{signal:AbortSignal.timeout(3000)}).then(async r=>{if(!r.ok)throw Error();const j=await r.json();if(j.success!==true||!Array.isArray(j.animes))throw Error()}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  vipvideo_data:
