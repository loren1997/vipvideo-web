# Intel 核显 NAS 一体化部署：播放器、夸克搜索、Plex 保护。
# 仅需修改 APP_PASSWORD 和 group_add 的核显组号，不需要 .env。
name: vipvideo-web

services:
  web:
    image: ghcr.io/loren1997/vipvideo-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 填入原部署密码，至少 16 位；留空时服务拒绝启动。
      APP_PASSWORD: ""
      PORT: "3000"
      DATA_DIR: /app/data
      COOKIE_SECURE: "false"
      BACKGROUND_MODE: low
      TRANSCODE_ENABLED: "true"
      TRANSCODE_ACCEL: vaapi
      TRANSCODE_ALLOW_SOFTWARE: "false"
      FFMPEG_PATH: ffmpeg
      LIBVA_DRIVER_NAME: iHD
      QUARK_SEARCH_API: http://pansou:8888/api/search
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # Ubuntu 执行 stat -c '%g' /dev/dri/renderD128，把下面占位文字替换为输出的数字。
      - "填写_RENDER_GID"
    volumes:
      - vipvideo_data:/app/data
    depends_on:
      pansou:
        condition: service_healthy
    stop_grace_period: 20s
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    blkio_config:
      weight: 100
    tmpfs:
      - /tmp:size=128m,mode=1777

  pansou:
    image: ghcr.io/fish2018/pansou@sha256:d371fe5caa87794414dd54cda063fcfc456d5013e18b65dbf1f6ca17f6299492
    restart: unless-stopped
    expose:
      - "8888"
    environment:
      PORT: "8888"
      AUTH_ENABLED: "false"
      CHANNELS: Quark_Movies
      ENABLED_PLUGINS: pansearch,quark4k,quarktv
      CONCURRENCY: "2"
      HTTP_MAX_CONNS: "4"
      PLUGIN_TIMEOUT: "6"
      ASYNC_PLUGIN_ENABLED: "true"
      ASYNC_RESPONSE_TIMEOUT: "4"
      ASYNC_MAX_BACKGROUND_WORKERS: "1"
      ASYNC_MAX_BACKGROUND_TASKS: "8"
      ASYNC_LOG_ENABLED: "false"
      CACHE_ENABLED: "true"
      CACHE_PATH: /app/cache
      CACHE_MAX_SIZE: "32"
      CACHE_TTL: "60"
      GOMAXPROCS: "1"
    cpus: 0.25
    cpu_shares: 128
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
      - /app/cache:size=64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vipvideo_data:
