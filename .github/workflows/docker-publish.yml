name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Set lowercase image and version
        id: image
        shell: bash
        run: |
          printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${GITHUB_REF_NAME,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Run amd64 and arm64 container checks
        env:
          CI_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { setTimeout as wait } from 'node:timers/promises';

          const base = 'http://127.0.0.1:3000';
          const password = 'ci-fixture-password';
          const docker = (...args) => execFileSync('docker', args, { stdio: 'inherit' });
          for (const architecture of ['amd64', 'arm64']) {
            const platform = `linux/${architecture}`;
            const name = `vipvideo-ci-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${architecture}`;
            const volume = `${name}-data`;
            let cookie = '';
            const api = (path, body) => fetch(base + path, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Connection: 'close', ...(cookie ? { Cookie: cookie } : {}), ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(10000),
            });
            async function start() {
              docker('run', '--detach', '--platform', platform, '--name', name, '--publish', '127.0.0.1:3000:3000',
                '--env', `APP_PASSWORD=${password}`, '--volume', `${volume}:/app/data`, process.env.CI_IMAGE);
              let lastError;
              for (let i = 0; i < 30; i++) {
                try {
                  const response = await fetch(base + '/health', { signal: AbortSignal.timeout(2000) });
                  if (response.ok) return;
                  lastError = new Error(`Health returned ${response.status}`);
                } catch (error) { lastError = error; }
                await wait(1000);
              }
              throw lastError ?? new Error('Container did not become ready');
            }
            docker('pull', '--platform', platform, process.env.CI_IMAGE);
            try {
              docker('volume', 'create', volume);
              await start();
              assert.equal((await api('/api/config')).status, 401);
              const login = await api('/api/auth/login', { password });
              assert.equal(login.status, 200);
              const setCookie = login.headers.get('set-cookie');
              assert.match(setCookie, /HttpOnly/);
              cookie = setCookie.split(';')[0];
              assert.equal((await api('/api/config')).status, 200);
              if (architecture === 'amd64') {
                const record = { key: 'ci-fixture-film', title: 'CI 持久化样例', type: 'movie' };
                assert.equal((await api('/api/favorites', record)).status, 200);
                assert.equal((await api('/api/history', { ...record, position: 83, duration: 100 })).status, 200);
                docker('stop', '--time', '20', name);
                docker('rm', name);
                await start();
                const response = await api('/api/state');
                assert.equal(response.status, 200);
                const state = await response.json();
                assert.equal(state.favorites.find(item => item.key === record.key)?.title, record.title);
                assert.equal(state.history.find(item => item.key === record.key)?.position, 83);
              }
              console.log(`${platform} image passed runtime checks.`);
            } finally {
              for (const args of [['logs', name], ['rm', '--force', name], ['image', 'rm', process.env.CI_IMAGE], ['volume', 'rm', volume]]) {
                const result = spawnSync('docker', args, { stdio: 'inherit' });
                if (result.status !== 0) {
                  console.error(`Docker cleanup failed: ${args.join(' ')}`);
                  process.exitCode = 1;
                }
              }
            }
          }
          NODE
      - name: Check Compose health and backup restore
        env:
          CI_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { existsSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const password = 'ci-compose-fixture-password';
          let config = readFileSync('docker-compose.yml', 'utf8');
          for (const [pattern, replacement] of [
            [/^    image: [^\r\n]+/gm, `    image: ${process.env.CI_IMAGE}`],
            [/^      APP_PASSWORD: ""(?=\r?$)/gm, `      APP_PASSWORD: "${password}"`],
            [/^      - "3000:3000"(?=\r?$)/gm, '      - "127.0.0.1:3000:3000"']
          ]) {
            assert.equal([...config.matchAll(pattern)].length, 1, `Expected one Compose replacement: ${pattern}`);
            config = config.replace(pattern, replacement);
          }
          const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'vipvideo-compose-'));
          const file = join(directory, 'docker-compose.yml');
          const backup = join(directory, 'backup');
          const project = `vipvideo-compose-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const prefix = ['compose', '-p', project, '-f', file];
          const compose = (...args) => execFileSync('docker', [...prefix, ...args], { stdio: 'inherit' });
          const start = () => {
            compose('up', '-d', '--wait', '--wait-timeout', '120');
            const container = execFileSync('docker', [...prefix, 'ps', '-q', 'web'], { encoding: 'utf8' }).trim();
            assert.ok(container, 'Compose must start the web container');
            assert.equal(execFileSync('docker', ['inspect', '--format', '{{.State.Health.Status}}', container], { encoding: 'utf8' }).trim(), 'healthy');
          };
          let cookie = '';
          const api = (path, body) => fetch('http://127.0.0.1:3000' + path, {
            method: body === undefined ? 'GET' : 'POST',
            headers: { Connection: 'close', ...(cookie ? { Cookie: cookie } : {}), ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
            ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            signal: AbortSignal.timeout(10000)
          });
          const record = { key: 'ci-compose-fixture', title: 'CI 备份恢复样例', type: 'movie' };
          const checkState = async position => {
            const response = await api('/api/state');
            assert.equal(response.status, 200, 'The original session must remain valid');
            const state = await response.json();
            assert.equal(state.favorites.find(item => item.key === record.key)?.title, record.title);
            assert.equal(state.history.find(item => item.key === record.key)?.position, position);
          };
          try {
            writeFileSync(file, config);
            start();
            const login = await api('/api/auth/login', { password });
            assert.equal(login.status, 200);
            assert.match(login.headers.get('set-cookie'), /HttpOnly/);
            cookie = login.headers.get('set-cookie').split(';')[0];
            assert.equal((await api('/api/favorites', record)).status, 200);
            assert.equal((await api('/api/history', { ...record, position: 83, duration: 100 })).status, 200);
            await checkState(83);

            compose('stop', 'web');
            compose('cp', 'web:/app/data', backup);
            assert.ok(existsSync(join(backup, 'app.sqlite')), 'The stopped backup must contain app.sqlite');
            start();
            assert.equal((await api('/api/history', { ...record, position: 19, duration: 100 })).status, 200);
            await checkState(19);

            compose('stop', 'web');
            compose('run', '--rm', '--no-deps', '--user', '0', '--entrypoint', 'sh', '--volume', `${backup}:/restore:ro`, 'web', '-c',
              'test -f /restore/app.sqlite && find /app/data -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && cp -a /restore/. /app/data/ && chown -R 1000:1000 /app/data');
            start();
            await checkState(83);
            console.log('Compose health, stopped backup, and restore passed');
          } finally {
            for (const args of [['logs', '--no-color', 'web'], ['down', '--volumes', '--remove-orphans']]) {
              const result = spawnSync('docker', [...prefix, ...args], { stdio: 'inherit' });
              if (result.status !== 0) {
                console.error(`Compose cleanup failed: ${args.join(' ')}`);
                process.exitCode = 1;
              }
            }
            rmSync(directory, { recursive: true, force: true });
          }
          NODE
      - name: Promote tested manifest to release tags
        env:
          CI_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          tags=(--tag "$IMAGE_NAME:latest")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(--tag "$IMAGE_NAME:$VERSION")
          fi
          docker buildx imagetools create "${tags[@]}" "$CI_IMAGE"
