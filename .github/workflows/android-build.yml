name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml", "README-ANDROID.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Prepare official Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then sdkmanager_path="$candidate"; break; fi
            done
          fi
          if [[ ! -x "$sdkmanager_path" ]]; then
            printf 'Android SDK command-line tools are missing under %s\n' "$ANDROID_HOME" >&2
            exit 1
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Check address selection fixtures
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/vipvideo-android-policy"
          mkdir -p "$classes"
          javac -encoding UTF-8 -d "$classes" android/app/src/main/java/io/github/loren1997/vipvideoweb/EndpointPolicy.java android/test/EndpointPolicyTest.java
          java -cp "$classes" io.github.loren1997.vipvideoweb.EndpointPolicyTest
      - name: Build and lint debug APK
        working-directory: android
        run: gradle --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare private release signing key
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice::未配置远端签名 Secrets，本次提供 debug 测试包、未签名正式包及本地签名工具。\n'
            exit 0
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'vipvideo-android-release.keystore'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=2 --console=plain :app:assembleRelease
      - name: Build unsigned release for local signing
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: gradle --no-daemon --max-workers=2 --console=plain :app:assembleRelease
      - name: Verify alignment and prepare local signing tool
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          mkdir -p "$RUNNER_TEMP/android-signing-tool"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/android-signing-tool/apksigner.jar"
          cd "$RUNNER_TEMP/android-signing-tool"
          sha256sum apksigner.jar > apksigner.jar.sha256
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.ready != 'true'
        with:
          name: vipvideo-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.ready != 'true'
        with:
          name: vipvideo-android-signing-tool
          path: ${{ runner.temp }}/android-signing-tool/
          if-no-files-found: error
          retention-days: 14
      - name: Verify signed APK and checksum
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p "$RUNNER_TEMP/android-release"
          cp "$apk" "$RUNNER_TEMP/android-release/VIPVideo-Web.apk"
          cd "$RUNNER_TEMP/android-release"
          sha256sum VIPVideo-Web.apk > VIPVideo-Web.apk.sha256
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.ready == 'true'
        with:
          name: android-release
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ANDROID_KEYSTORE_PATH:-}" == "$RUNNER_TEMP/vipvideo-android-release.keystore" ]]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi

  publish:
    needs: build
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release
      - name: Publish verified APK
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c VIPVideo-Web.apk.sha256
          notes="$RUNNER_TEMP/vipvideo-android-release-notes.md"
          printf 'Android 手机与电视通用 WebView 客户端。\n\n版本：1.0.%s\n源码提交：%s\n\n安装和首次地址配置请阅读 README-ANDROID.md。\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > "$notes"
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" --title "Android 最新安装包" --notes-file "$notes"
          else
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Android 最新安装包" --notes-file "$notes"
          fi
          gh release upload android-latest VIPVideo-Web.apk VIPVideo-Web.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
