name: vipvideo-web

services:
  web:
    build: .
    image: vipvideo-web:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?请先在 .env 中设置 APP_PASSWORD}
      PORT: "3000"
      DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRANSCODE_ENABLED: "${TRANSCODE_ENABLED:-true}"
      TRANSCODE_ACCEL: "${TRANSCODE_ACCEL:-auto}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
    volumes:
      - vipvideo_data:/app/data
    stop_grace_period: 20s

volumes:
  vipvideo_data:
