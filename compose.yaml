name: vipvideo-web

services:
  web:
    build: .
    image: vipvideo-web:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?请先在 .env 中设置 APP_PASSWORD}
      PORT: "3000"
      DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKGROUND_MODE: "${BACKGROUND_MODE:-normal}"
      TRANSCODE_ENABLED: "${TRANSCODE_ENABLED:-true}"
      TRANSCODE_ACCEL: "${TRANSCODE_ACCEL:-auto}"
      TRANSCODE_ALLOW_SOFTWARE: "${TRANSCODE_ALLOW_SOFTWARE:-true}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
    volumes:
      - vipvideo_data:/app/data
    stop_grace_period: 20s
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    blkio_config:
      weight: 100

volumes:
  vipvideo_data:
